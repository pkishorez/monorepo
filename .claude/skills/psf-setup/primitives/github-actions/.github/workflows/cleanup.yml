name: Cleanup __APP_NAME__ preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: __APP_NAME__-pr${{ github.event.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      STAGE: pr${{ github.event.number }}
      ALLOW_DEPLOY: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter __APP_NAME__...
      - run: pnpm --filter __APP_NAME__... run build
      - name: Look for the stage
        id: lookup
        run: |
          if ! stages=$(pnpm -C __APP_PATH__ exec alchemy state stages --stack __STACK_NAME__ 2>&1); then
            echo "::warning::Could not list stages; attempting destroy anyway."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$stages" | grep -qxF "$STAGE"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Destroy preview
        id: destroy
        if: steps.lookup.outputs.exists == 'true'
        continue-on-error: true
        run: pnpm -C __APP_PATH__ exec alchemy destroy --stage "$STAGE" --yes
      - name: Force-clear orphaned state
        if: steps.destroy.outcome == 'failure'
        run: |
          echo "::warning::destroy failed for $STAGE; clearing state. Some resources may need manual cleanup."
          pnpm -C __APP_PATH__ exec alchemy state clear --stack __STACK_NAME__ --stage "$STAGE" --yes
          exit 1
      - name: Cleanup summary
        if: always()
        env:
          EXISTS: ${{ steps.lookup.outputs.exists }}
          OUTCOME: ${{ steps.destroy.outcome }}
        run: |
          case "$OUTCOME" in
            success) echo 'Preview destroyed.' >> "$GITHUB_STEP_SUMMARY" ;;
            failure) echo 'Preview destroy failed; state cleared.' >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo 'No preview to destroy.' >> "$GITHUB_STEP_SUMMARY" ;;
          esac
