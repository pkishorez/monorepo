name: Deploy __APP_NAME__

on:
  push:
    branches: [__PRODUCTION_BRANCH__]
    paths:
      - '__APP_PATH__/**'
      - 'toolkits/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '__APP_PATH__/**'
      - 'toolkits/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: __APP_NAME__-${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || 'prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      STAGE: ${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || 'prod' }}
      ALLOW_DEPLOY: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter __APP_NAME__...
      - run: pnpm --filter __APP_NAME__... run build
      - run: pnpm --filter __APP_NAME__ run lint
      - run: pnpm --filter __APP_NAME__ run test
      - run: pnpm -C __APP_PATH__ exec alchemy cloudflare bootstrap
      - run: pnpm -C __APP_PATH__ exec alchemy deploy --stage "$STAGE" --yes
      - name: Deployment summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          host='__PRODUCTION_HOST__'
          if [ "$STAGE" != prod ]; then host="$STAGE-$host"; fi
          if [ "$RESULT" = success ]; then
            echo "$STAGE deployed: https://$host" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$STAGE deployment $RESULT. Review the deployment job." >> "$GITHUB_STEP_SUMMARY"
          fi
