<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · Code</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        font:
          15px/1.5 system-ui,
          sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 22rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        opacity: 0.7;
      }
      a {
        align-self: start;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        padding: 0 1rem;
        border-radius: 0.5rem;
        background: CanvasText;
        color: Canvas;
        text-decoration: none;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        This page wasn't opened on this device yet, so there's nothing saved to
        show. Pages you've opened before still work offline.
      </p>
      <a id="again" href="/">Try again</a>
    </main>
    <script>
      // Back to the page asked for, only if it is on this site.
      const from = new URLSearchParams(location.search).get('from');
      if (from?.startsWith('/') && !from.startsWith('//'))
        document.getElementById('again').href = from;
    </script>
  </body>
</html>
