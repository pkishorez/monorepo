name: Cleanup

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number whose preview to destroy (e.g. 3)'
        required: true
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      # Supplied explicitly so Alchemy skips the STS GetCallerIdentity it
      # would otherwise use to discover the account id.
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      BANK_AWS_ACCESS_KEY_ID: ${{ secrets.BANK_AWS_ACCESS_KEY_ID }}
      BANK_AWS_SECRET_ACCESS_KEY: ${{ secrets.BANK_AWS_SECRET_ACCESS_KEY }}
      BANK_ADMIN_KEY: ${{ secrets.BANK_ADMIN_KEY }}
      # Destroy also evaluates apps/docs/alchemy.run.ts, whose accident-guard
      # refuses deployed stages without this opt-in.
      ALLOW_DEPLOY: 'true'
      # workflow_call passes a stage directly; workflow_dispatch takes a PR number.
      STAGE: ${{ inputs.stage || format('pr{0}', inputs.pr) }}
      # Non-production stages own isolated tables named <stage>-std-bank-v4.
      BANK_DYNAMODB_TABLE: ${{ format('{0}-std-bank-v4', inputs.stage || format('pr{0}', inputs.pr)) }}
    steps:
      - name: Validate stage
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && ! echo "${{ inputs.pr }}" | grep -qE '^[0-9]+$'; then
            echo "PR number must be numeric, got '${{ inputs.pr }}'." >&2
            exit 1
          fi
          if [ "$STAGE" = "prod" ]; then
            echo "Refusing to destroy the '$STAGE' stage." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      # Destroy only needs the docs project and its workspace deps.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter docs...

      # Workspace packages docs consumes export dist, so alchemy.run.ts (and
      # anything it imports, like the bank demo's contract) needs it built
      # before any alchemy command runs — mirrors deploy.yml's Build step.
      - name: Build
        run: pnpm --filter docs... run build

      # Previews are only ever created by a deliberate dispatch, so most PRs
      # close with no stage to destroy. Ask the state store first and skip
      # quietly when there is nothing there; if the store cannot answer,
      # attempt the destroy anyway rather than leave resources running.
      - name: Look for the stage
        id: lookup
        run: |
          if ! stages=$(pnpm -C apps/docs exec alchemy state stages --stack Docs 2>&1); then
            echo "::warning::Could not list stages for the Docs stack — attempting destroy anyway."
            echo "$stages"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$stages" | grep -qxF "$STAGE"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No '$STAGE' stage in the Docs stack — nothing to destroy."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Destroy docs preview
        id: destroy
        if: steps.lookup.outputs.exists == 'true'
        continue-on-error: true
        run: pnpm -C apps/docs exec alchemy destroy --stage "$STAGE" --yes

      - name: State tree
        if: steps.lookup.outputs.exists == 'true'
        run: pnpm -C apps/docs exec alchemy state tree || true

      - name: Force-clear orphaned state on destroy failure
        if: steps.destroy.outcome == 'failure'
        run: |
          echo "::warning::alchemy destroy failed for stage '$STAGE' — force-clearing alchemy state so the stage does not linger. Some cloud resources may need manual cleanup."
          pnpm -C apps/docs exec alchemy state clear --stack Docs --stage "$STAGE" --yes

      - name: Fail if destroy failed
        if: steps.destroy.outcome == 'failure'
        run: exit 1

      - name: Job summary
        if: always()
        env:
          DESTROY_OUTCOME: ${{ steps.destroy.outcome }}
        run: |
          case "$DESTROY_OUTCOME" in
            success) status="🗑️ destroyed" ;;
            failure) status="❌ destroy failed (state force-cleared)" ;;
            *) status="⏭️ no stage to destroy" ;;
          esac
          {
            echo "## Cleanup — \`$STAGE\`"
            echo ""
            echo "| App | Status |"
            echo "| --- | --- |"
            echo "| docs | $status |"
          } >> "$GITHUB_STEP_SUMMARY"
