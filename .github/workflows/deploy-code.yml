name: 🚀 deploy:code

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
    # The changeset release PR changes only these, so it starts no run.
    paths-ignore:
      - '.changeset/**'
      - '**/CHANGELOG.md'
      - '**/package.json'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy: prod, demo, or pr<N> for a preview of that PR'
        required: true
        type: string

concurrency:
  group: code-${{ inputs.stage || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.affected.outputs.affected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      # Only the app, ai-toolkit (its Machines Backend and client) and this
      # workflow deploy it; a change to another workspace package does not.
      # Run it by hand to ship one.
      - name: Check code affected
        id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'affected=true' >> "$GITHUB_OUTPUT"
          elif [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Base '$BASE' unknown; deploying to be safe."
            echo 'affected=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$(git merge-base "$BASE" HEAD)" HEAD \
            | grep -E '^(apps/code/|toolkits/ai-toolkit/|\.github/workflows/deploy-code\.yml$)'; then
            echo 'affected=true' >> "$GITHUB_OUTPUT"
          else
            echo 'affected=false' >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: detect
    if: needs.detect.outputs.affected == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Opt-in required by the accident guard in apps/code/src/infra/stage.ts.
      ALLOW_DEPLOY: 'true'
      STAGE: ${{ inputs.stage || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || 'prod' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Validate stage
        run: |
          if ! printf '%s' "$STAGE" | grep -qxE 'prod|demo|pr[0-9]+'; then
            echo "::error::Stage must be 'prod', 'demo' or 'pr<N>', got '$STAGE'." >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Unexpected ref '${{ github.ref }}' — pushes deploy only from main." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter code...

      # Build the app's workspace dependencies; Alchemy builds the app itself.
      - name: Build workspace dependencies
        run: pnpm --filter 'code^...' run build

      - name: Bootstrap Alchemy state store
        run: pnpm -C apps/code exec alchemy provider cloudflare bootstrap

      - name: Deploy code
        run: pnpm -C apps/code exec alchemy deploy --stage "$STAGE" --yes

      - name: Mark PR as having a preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$STAGE" in
            pr[0-9]*) gh api -X POST "repos/${{ github.repository }}/issues/${STAGE#pr}/labels" -f 'labels[]=preview:code' --silent ;;
          esac

      - name: State tree
        if: always()
        run: pnpm -C apps/code exec alchemy state list --recursive || true

  summary:
    needs: [detect, deploy]
    if: always() && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - name: Job summary
        env:
          STAGE: ${{ inputs.stage || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || 'prod' }}
          AFFECTED: ${{ needs.detect.outputs.affected }}
          RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "$STAGE" = "prod" ]; then
            url="https://code.kishore.app" api="https://api-code.kishore.app"
          else
            url="https://$STAGE-code.kishore.app" api="https://$STAGE-api-code.kishore.app"
          fi
          case "$RESULT" in
            success) status="✅ deployed" ;;
            failure) status="❌ failed" ;;
            skipped) if [ "$AFFECTED" = false ]; then status="⏭️ unchanged, skipped"; else status="⏭️ not eligible"; fi ;;
            *) status="$RESULT" ;;
          esac
          {
            echo "## Deploy — \`$STAGE\`"
            echo ""
            echo "| App | Status | URL |"
            echo "| --- | --- | --- |"
            echo "| code | $status | $url |"
            echo "| Machines API | $status | $api |"
          } >> "$GITHUB_STEP_SUMMARY"
