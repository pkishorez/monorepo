name: 🚀 deploy:docs

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy: prod, demo, or pr<N> for a preview of that PR'
        required: true
        type: string

concurrency:
  group: docs-${{ inputs.stage || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.affected.outputs.affected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - name: Check docs affected
        id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'affected=true' >> "$GITHUB_OUTPUT"
          else
            .github/scripts/affected.sh apps/docs .github/workflows/deploy-docs.yml "$BASE"
          fi

  deploy:
    needs: detect
    if: needs.detect.outputs.affected == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      # Lets Alchemy skip the STS account lookup.
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      # Opt-in required by the accident guard in apps/docs/alchemy.run.ts.
      ALLOW_DEPLOY: 'true'
      STAGE: ${{ inputs.stage || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || 'prod' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Validate stage
        run: |
          if ! printf '%s' "$STAGE" | grep -qxE 'prod|demo|pr[0-9]+'; then
            echo "::error::Stage must be 'prod', 'demo' or 'pr<N>', got '$STAGE'." >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Unexpected ref '${{ github.ref }}' — pushes deploy only from main." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Bootstrap Alchemy state store
        run: pnpm -C apps/docs exec alchemy cloudflare bootstrap

      - name: Deploy docs
        run: pnpm -C apps/docs exec alchemy deploy --stage "$STAGE" --yes

      - name: Mark PR as having a preview
        if: startsWith(env.STAGE, 'pr')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/issues/${STAGE#pr}/labels" -f 'labels[]=preview:docs' --silent

      - name: State tree
        if: always()
        run: pnpm -C apps/docs exec alchemy state tree || true

  summary:
    needs: [detect, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Job summary
        env:
          STAGE: ${{ inputs.stage || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || 'prod' }}
          AFFECTED: ${{ needs.detect.outputs.affected }}
          RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "$STAGE" = "prod" ]; then
            docs_url="https://docs.kishore.app"
          else
            docs_url="https://$STAGE-docs.kishore.app"
          fi
          case "$RESULT" in
            success) status="✅ deployed" ;;
            failure) status="❌ failed" ;;
            skipped) if [ "$AFFECTED" = false ]; then status="⏭️ unchanged, skipped"; else status="⏭️ not eligible"; fi ;;
            *) status="$RESULT" ;;
          esac
          {
            echo "## Deploy — \`$STAGE\`"
            echo ""
            echo "| App | Status | URL |"
            echo "| --- | --- | --- |"
            echo "| docs | $status | $docs_url |"
          } >> "$GITHUB_STEP_SUMMARY"
