name: 🧹 cleanup:alchemy-console
on:
  pull_request:
    types: [closed]
    # The changeset release PR changes only these, so it starts no run.
    paths-ignore:
      - '.changeset/**'
      - '**/CHANGELOG.md'
      - '**/package.json'
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number whose preview should be destroyed
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: alchemy-console-pr${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.number }}
  cancel-in-progress: false
jobs:
  cleanup:
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') && (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'preview:console')) }}
    runs-on: ubuntu-latest
    env:
      STAGE: pr${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 'on' once the Cloudflare token may deploy Containers: binds run containers.
      CONSOLE_RUNNERS: ${{ vars.CONSOLE_RUNNERS }}
      # The stack reads the Vault key and the GitHub App's keys while it is
      # evaluated, destroys too; a preview is wired to the alchemy-console App.
      CONSOLE_VAULT_KEY: ${{ secrets.CONSOLE_VAULT_KEY }}
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_SLUG: ${{ secrets.GH_APP_SLUG }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      GH_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
      GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
      GH_APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter 'alchemy-console^...' run build
      - run: pnpm --filter alchemy-console build
      - name: Find preview
        id: preview
        run: |
          if ! printf '%s\n' "$STAGE" | grep -qxE 'pr[0-9]+'; then exit 1; fi
          if stages=$(pnpm -C apps/alchemy-console exec alchemy state list AlchemyConsole --backend cloudflare); then
            if printf '%s\n' "$stages" | grep -qxF "AlchemyConsole/$STAGE/"; then
              echo 'exists=true' >> "$GITHUB_OUTPUT"
            else
              echo 'exists=false' >> "$GITHUB_OUTPUT"
            fi
          else
            status=$?
            printf '%s\n' "$stages" >&2
            echo "::error::Preview lookup failed for $STAGE"
            exit "$status"
          fi
      - name: Destroy preview
        if: steps.preview.outputs.exists == 'true'
        run: pnpm -C apps/alchemy-console exec alchemy destroy --stage "$STAGE" --yes
      - name: Remove preview label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/${STAGE#pr}/labels/preview:console" --silent || true
      - name: Cleanup summary
        if: always()
        env:
          RESULT: ${{ job.status }}
          EXISTS: ${{ steps.preview.outputs.exists }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "Preview cleanup $RESULT; review the job and retry." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$EXISTS" = false ]; then
            echo 'Preview cleanup skipped: no preview exists.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Preview destroyed.' >> "$GITHUB_STEP_SUMMARY"
          fi
