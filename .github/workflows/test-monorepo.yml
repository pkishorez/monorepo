name: 🧪 test:monorepo

on:
  pull_request:
    # The changeset release PR changes only these, so it starts no run.
    paths-ignore:
      - '.changeset/**'
      - '**/CHANGELOG.md'
      - '**/package.json'
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest

    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8090:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: code's bundle size
        run: pnpm -C apps/code size

      - name: Laymos
        run: node .github/scripts/laymos-lint.mjs

      - name: Wait for DynamoDB Local
        run: timeout 30s bash -c 'until curl --silent --output /dev/null http://localhost:8090; do sleep 1; done'

      - name: Test
        run: |
          node --test .github/scripts/test-summary.test.mjs
          node .github/scripts/test.mjs
