name: Deploy alchemy-console
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
concurrency:
  group: alchemy-console-${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || 'prod' }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      STAGE: ${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || 'prod' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter 'alchemy-console^...' run build
      - run: pnpm --filter alchemy-console build
      - run: pnpm lint:syncpack && pnpm --filter alchemy-console lint
      - run: pnpm -C apps/alchemy-console exec alchemy cloudflare bootstrap
      - run: pnpm -C apps/alchemy-console exec alchemy deploy --stage "$STAGE" --yes
  summary:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment summary
        env:
          RESULT: ${{ needs.deploy.result }}
          STAGE: ${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || 'prod' }}
        run: |
          case "$RESULT" in
            success)
              host='alchemy.kishore.app'
              if [ "$STAGE" != prod ]; then host="$STAGE-$host"; fi
              echo "$STAGE deployed: https://$host" >> "$GITHUB_STEP_SUMMARY"
              ;;
            skipped) echo "$STAGE deployment skipped: this event is not eligible for deployment." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "$STAGE deployment $RESULT. Review the deployment job." >> "$GITHUB_STEP_SUMMARY" ;;
          esac
