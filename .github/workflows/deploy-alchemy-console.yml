name: 🚀 deploy:alchemy-console
on:
  push:
    # main deploys prod; console-next, the rewrite under review, deploys dev.
    branches: [main, console-next]
  pull_request:
    types: [opened, reopened, synchronize]
    # The changeset release PR changes only these, so it starts no run.
    paths-ignore:
      - '.changeset/**'
      - '**/CHANGELOG.md'
      - '**/package.json'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy: prod, dev, or pr<N> for a preview of that PR'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: alchemy-console-${{ inputs.stage || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || (github.ref_name == 'console-next' && 'dev') || 'prod' }}
  cancel-in-progress: false
jobs:
  detect:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.affected.outputs.affected }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: Check alchemy-console affected
        id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo 'affected=true' >> "$GITHUB_OUTPUT"
          else
            .github/scripts/affected.sh apps/alchemy-console .github/workflows/deploy-alchemy-console.yml "$BASE"
          fi
  deploy:
    needs: detect
    if: needs.detect.outputs.affected == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      STAGE: ${{ inputs.stage || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || (github.ref_name == 'console-next' && 'dev') || 'prod' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # dev is wired to the alchemy-console-dev GitHub App and its own vault
      # key; prod and the previews to the alchemy-console App's. Both follow
      # the stage deployed, so a manual dev deploy from another branch never
      # swaps dev's App or key for prod's.
      GH_APP_ID: ${{ (inputs.stage || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || (github.ref_name == 'console-next' && 'dev') || 'prod') == 'dev' && secrets.DEV_GH_APP_ID || secrets.GH_APP_ID }}
      GH_APP_SLUG: ${{ (inputs.stage || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || (github.ref_name == 'console-next' && 'dev') || 'prod') == 'dev' && secrets.DEV_GH_APP_SLUG || secrets.GH_APP_SLUG }}
      GH_APP_WEBHOOK_SECRET: ${{ (inputs.stage || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || (github.ref_name == 'console-next' && 'dev') || 'prod') == 'dev' && secrets.DEV_GH_APP_WEBHOOK_SECRET || secrets.GH_APP_WEBHOOK_SECRET }}
      GH_APP_PRIVATE_KEY: ${{ (inputs.stage || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || (github.ref_name == 'console-next' && 'dev') || 'prod') == 'dev' && secrets.DEV_GH_APP_PRIVATE_KEY || secrets.GH_APP_PRIVATE_KEY }}
      GH_APP_CLIENT_ID: ${{ (inputs.stage || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || (github.ref_name == 'console-next' && 'dev') || 'prod') == 'dev' && secrets.DEV_GH_APP_CLIENT_ID || secrets.GH_APP_CLIENT_ID }}
      GH_APP_CLIENT_SECRET: ${{ (inputs.stage || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || (github.ref_name == 'console-next' && 'dev') || 'prod') == 'dev' && secrets.DEV_GH_APP_CLIENT_SECRET || secrets.GH_APP_CLIENT_SECRET }}
      CONSOLE_VAULT_KEY: ${{ (inputs.stage || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || (github.ref_name == 'console-next' && 'dev') || 'prod') == 'dev' && secrets.DEV_CONSOLE_VAULT_KEY || secrets.CONSOLE_VAULT_KEY }}
    steps:
      - name: Validate stage
        run: |
          if ! printf '%s\n' "$STAGE" | grep -qxE 'prod|dev|pr[0-9]+'; then
            echo "::error::Stage must be 'prod', 'dev' or 'pr<N>', got '$STAGE'."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter 'alchemy-console^...' run build
      - run: pnpm --filter alchemy-console build
      - run: pnpm -C apps/alchemy-console exec alchemy provider cloudflare bootstrap
      - name: Inspect alchemy-console state without a development port
        run: env -u PORT pnpm -C apps/alchemy-console exec alchemy state list AlchemyConsole --backend cloudflare
      - run: pnpm -C apps/alchemy-console exec alchemy deploy --stage "$STAGE" --yes
      - name: Mark PR as having a preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$STAGE" in
            pr[0-9]*) gh api -X POST "repos/${{ github.repository }}/issues/${STAGE#pr}/labels" -f 'labels[]=preview:console' --silent ;;
          esac
  summary:
    needs: [detect, deploy]
    if: always() && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - name: Deployment summary
        env:
          AFFECTED: ${{ needs.detect.outputs.affected }}
          RESULT: ${{ needs.deploy.result }}
          STAGE: ${{ inputs.stage || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || (github.ref_name == 'console-next' && 'dev') || 'prod' }}
        run: |
          case "$RESULT" in
            success)
              host='console.kishore.app'
              if [ "$STAGE" != prod ]; then host="$STAGE-$host"; fi
              echo "$STAGE deployed: https://$host" >> "$GITHUB_STEP_SUMMARY"
              ;;
            skipped)
              if [ "$AFFECTED" = false ]; then
                echo "$STAGE deployment skipped: alchemy-console is unchanged." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "$STAGE deployment skipped: this event is not eligible for deployment." >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            *) echo "$STAGE deployment $RESULT. Review the deployment job." >> "$GITHUB_STEP_SUMMARY" ;;
          esac
