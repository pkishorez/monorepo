name: 🚀 deploy:kabuki-start

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
    # The changeset release PR changes only these, so it starts no run.
    paths-ignore:
      - '.changeset/**'
      - '**/CHANGELOG.md'
      - '**/package.json'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy: prod, demo, or pr<N> for a preview of that PR'
        required: true
        type: string

concurrency:
  group: kabuki-start-${{ inputs.stage || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.affected.outputs.affected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - name: Check kabuki-start affected
        id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'affected=true' >> "$GITHUB_OUTPUT"
          else
            # The native shells run against this deploy, so a change to them
            # deploys too, or their jobs would never start.
            .github/scripts/affected.sh apps/kabuki-start .github/workflows/deploy-kabuki-start.yml "$BASE" \
              apps/capacitor-kabuki-start/ .github/workflows/native-kabuki-start.yml
          fi

  deploy:
    needs: detect
    if: needs.detect.outputs.affected == 'true'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Opt-in required by the accident guard in @kestack/web-platform/app/alchemy.
      ALLOW_DEPLOY: 'true'
      STAGE: ${{ inputs.stage || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || 'prod' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Validate stage
        run: |
          if ! printf '%s' "$STAGE" | grep -qxE 'prod|demo|pr[0-9]+'; then
            echo "::error::Stage must be 'prod', 'demo' or 'pr<N>', got '$STAGE'." >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Unexpected ref '${{ github.ref }}' — pushes deploy only from main." >&2
            exit 1
          fi

      - name: Site URL
        id: url
        run: |
          if [ "$STAGE" = "prod" ]; then
            echo 'url=https://start.kishore.app' >> "$GITHUB_OUTPUT"
          else
            echo "url=https://$STAGE-start.kishore.app" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter kabuki-start...

      # Build the app's workspace dependencies; Alchemy builds the app itself.
      - name: Build workspace dependencies
        run: pnpm --filter 'kabuki-start^...' run build

      - name: Bootstrap Alchemy state store
        run: pnpm -C apps/kabuki-start exec alchemy state bootstrap --backend cloudflare

      - name: Deploy kabuki-start
        run: pnpm -C apps/kabuki-start exec alchemy deploy --stage "$STAGE" --yes

      - name: Mark PR as having a preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$STAGE" in
            pr[0-9]*) gh api -X POST "repos/${{ github.repository }}/issues/${STAGE#pr}/labels" -f 'labels[]=preview:kabuki-start' --silent ;;
          esac

      - name: State tree
        if: always()
        run: pnpm -C apps/kabuki-start exec alchemy state list --recursive || true

  # The Android and iOS shells, opened on this deploy's /native page.
  native:
    needs: deploy
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/native-kabuki-start.yml
    with:
      url: ${{ needs.deploy.outputs.url }}/native?proof=1

  summary:
    needs: [detect, deploy]
    if: always() && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - name: Job summary
        env:
          STAGE: ${{ inputs.stage || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || 'prod' }}
          AFFECTED: ${{ needs.detect.outputs.affected }}
          RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "$STAGE" = "prod" ]; then
            url="https://start.kishore.app"
          else
            url="https://$STAGE-start.kishore.app"
          fi
          case "$RESULT" in
            success) status="✅ deployed" ;;
            failure) status="❌ failed" ;;
            skipped) if [ "$AFFECTED" = false ]; then status="⏭️ unchanged, skipped"; else status="⏭️ not eligible"; fi ;;
            *) status="$RESULT" ;;
          esac
          {
            echo "## Deploy — \`$STAGE\`"
            echo ""
            echo "| App | Status | URL |"
            echo "| --- | --- | --- |"
            echo "| kabuki-start | $status | $url |"
          } >> "$GITHUB_STEP_SUMMARY"
