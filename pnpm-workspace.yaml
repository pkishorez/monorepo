packages:
  - apps/*
  - devtools/*
  - packages/*
  - toolkits/*

# Hold new releases for 24 hours (in minutes) so compromised versions have time to be reported.
minimumReleaseAge: 1440

# Vite+ requires its bundled Vite and Vitest across the dependency graph.
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'

peerDependencyRules:
  allowedVersions:
    # The Vite+ core alias reports 0.3.0 but bundles Vite 8.2.2.
    vite: '0.3.0'
    # bun-ffi-structs works with the workspace's TypeScript 7 toolchain.
    'bun-ffi-structs>typescript': '7'

# pnpm 11 requires an explicit decision for every detected dependency build script.
# Only better-sqlite3 needs its native install step; keep every other script denied.
allowBuilds:
  better-sqlite3: true
  '@parcel/watcher': false
  esbuild: false
  msgpackr-extract: false
  msw: false
  sharp: false
  workerd: false
  # Pulled in transitively by better-auth's optional Prisma adapter, which
  # this package doesn't use.
  '@prisma/client': false

