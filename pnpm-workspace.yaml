packages:
  - apps/*
  - devtools/*
  - packages/*
  - toolkits/*
  - platforms/*

# Hold new releases for 24 hours (in minutes) so compromised versions have time to be reported.
minimumReleaseAge: 1440
# TEMPORARY: alchemy 2.0.0-beta.84 is taken before it clears the hold, by
# choice, with its provider packages (the last, @alchemy.run/sql, at
# 2026-10-24 04:02 UTC) and the distilled 1.0.0-rc.17 they pin. Remove after
# 2026-10-25 04:03 UTC.
minimumReleaseAgeExclude:
  - alchemy
  - '@alchemy.run/*'
  - '@distilled.cloud/*'

# Refuse a version published with weaker trust than earlier versions (for
# example without provenance): the usual sign of a stolen publish token.
trustPolicy: no-downgrade
trustPolicyExclude:
  # A 2023 backport to the 6.x line Babel requires; semver added provenance
  # later, on 7.x only.
  - semver@6.3.1

# Vite+ requires its bundled Vite and Vitest across the dependency graph.
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'

peerDependencyRules:
  allowedVersions:
    # The Vite+ core alias reports 1.4.0 but bundles Vite 8.3.5.
    vite: '1.4.0'
    # bun-ffi-structs works with the workspace's TypeScript 7 toolchain.
    'bun-ffi-structs>typescript': '7'
    # capnp-es, through alchemy's Cloudflare runtime, works with TypeScript 7 too.
    'capnp-es>typescript': '7'

# pnpm 11 requires an explicit decision for every detected dependency build script.
# Only better-sqlite3 needs its native install step; keep every other script denied.
allowBuilds:
  better-sqlite3: true
  cloudflared: false
  '@parcel/watcher': false
  esbuild: false
  msgpackr-extract: false
  msw: false
  protobufjs: false
  sharp: false
  workerd: false
  # Pulled in transitively by better-auth's optional Prisma adapter, which
  # this package doesn't use.
  '@prisma/client': false

